<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบจัดการองค์กรอัจฉริยะ</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (Config) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        enterprise: {
                            50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6',
                            600: '#0d9488', 700: '#0f766e', 900: '#134e4a',
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'floating': '0 20px 40px -15px rgba(13, 148, 136, 0.15)',
                    }
                }
            }
        }
    </script>
    
    <!-- 🔗 เรียกใช้ไฟล์ CSS ที่แยกไว้ -->
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body class="mesh-bg text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Main Container -->
    <main class="w-full max-w-6xl bg-white rounded-3xl shadow-premium overflow-hidden flex flex-col lg:flex-row relative">
        
        <!-- Left: Image & Branding -->
        <section class="hidden lg:flex lg:w-1/2 bg-slate-50 relative items-center justify-center p-12 border-r border-slate-100">
            <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-enterprise-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
            
            <div class="relative z-10 w-full max-w-md text-center">
                <img src="https://illustrations.popsy.co/amber/working-from-home.svg" alt="Work securely" class="w-full h-auto mb-8 drop-shadow-xl">
                <h2 class="text-2xl font-bold text-slate-800 mb-3">ทำงานร่วมกันอย่างราบรื่น</h2>
                <p class="text-slate-500 font-light">ระบบ Enterprise Resource Planning ที่ออกแบบมาเพื่อยกระดับศักยภาพองค์กร</p>
                <div class="mt-8 flex justify-center gap-6 opacity-50 grayscale">
                    <i class="fa-brands fa-aws text-2xl"></i>
                    <i class="fa-brands fa-microsoft text-2xl"></i>
                    <i class="fa-brands fa-google text-2xl"></i>
                </div>
            </div>
        </section>

        <!-- Right: Login Form -->
        <section class="w-full lg:w-1/2 p-8 sm:p-12 lg:p-16 xl:p-20 bg-white flex flex-col justify-center relative">
            <div class="w-full max-w-md mx-auto">
                <div class="w-12 h-12 bg-enterprise-50 text-enterprise-600 rounded-xl flex items-center justify-center text-xl shadow-sm mb-8 border border-enterprise-100">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 mb-2">ลงชื่อเข้าใช้งาน</h1>
                <p class="text-slate-500 mb-8">กรอกข้อมูลประจำตัวของคุณเพื่อเข้าสู่ระบบ</p>

                <!-- Form -->
                <form id="enterpriseLogin" class="space-y-6" novalidate>
                    <!-- Alert Message -->
                    <div id="statusMessage" class="hidden flex items-center gap-3 p-4 rounded-xl text-sm font-medium transition-all duration-300">
                        <i id="statusIcon" class="fa-solid"></i>
                        <span id="statusText"></span>
                    </div>

                    <!-- Email -->
                    <div class="relative">
                        <input type="email" id="userEmail" name="userEmail" placeholder=" " required
                            class="floating-input block w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-enterprise-500 focus:ring-4 focus:ring-enterprise-500/10 font-inter text-md">
                        <label for="userEmail" class="floating-label">อีเมลองค์กร (Work Email)</label>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="relative">
                        <input type="password" id="userPassword" name="userPassword" placeholder=" " required
                            class="floating-input block w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-enterprise-500 focus:ring-4 focus:ring-enterprise-500/10 font-inter text-md">
                        <label for="userPassword" class="floating-label">รหัสผ่าน (Password)</label>
                        <button type="button" id="togglePassBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-enterprise-600 transition-colors focus:outline-none">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between mt-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="custom-checkbox w-4 h-4 rounded border-slate-300 text-enterprise-600 focus:ring-enterprise-500 transition-all">
                            <span class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors">อยู่ในระบบต่อไป</span>
                        </label>
                        <a href="#" class="text-sm font-medium text-enterprise-600 hover:text-enterprise-700 hover:underline transition-all">
                            ลืมรหัสผ่าน?
                        </a>
                    </div>

                    <button type="submit" id="loginBtn" 
                        class="btn-hover-effect relative w-full flex justify-center items-center gap-2 py-3.5 px-4 bg-enterprise-600 hover:bg-enterprise-700 text-white font-medium rounded-xl shadow-floating focus:outline-none focus:ring-4 focus:ring-enterprise-500/30 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span id="btnLabel">เข้าสู่ระบบ (Sign In)</span>
                        <div id="btnLoading" class="spinner"></div>
                    </button>
                </form>

                <div class="mt-10 text-center text-sm text-slate-500">
                    <p>มีปัญหาในการเข้าสู่ระบบ? <a href="#" class="text-enterprise-600 hover:underline font-medium">ติดต่อฝ่าย IT Support</a></p>
                </div>
            </div>
        </section>
    </main>

    <!-- 🔗 เรียกใช้ไฟล์ JS ที่แยกไว้ -->
    <script src="../src/js/app.js"></script>
</body>
</html>
